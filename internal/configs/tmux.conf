set -g default-terminal "tmux-256color"
# terminal-features matches the outer TERM; alacritty and foot need naming as they do not set TERM=xterm-*
set -as terminal-features ",xterm*:RGB,alacritty:RGB,foot:RGB"

set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
setw -g automatic-rename on
set -g set-titles on
set -g history-limit 99999
set -g status-position top
set -g display-time 4000
set -g status-interval 5
set -g status-keys emacs
setw -g aggressive-resize on
# nvim needs this to fire FocusGained/FocusLost and reload buffers changed outside the editor
set -g focus-events on
# Without this, Esc in nvim is delayed while tmux waits to see if it starts an escape sequence
set -sg escape-time 0

bind -n m-= next-window
bind -n m-- previous-window
bind -n S-Right select-pane -R
bind -n S-Left select-pane -L
bind -n S-Down select-pane -D
bind -n S-Up select-pane -U
bind -n m-\\ split-window -h
bind -n m-| split-window -v
bind -n m-v paste-buffer

bind R source-file ~/.tmux.conf \; display-message "sourced ~/.tmux.conf"

bind-key -T copy-mode MouseDragEnd1Pane send -X copy-selection
bind-key -T copy-mode-vi MouseDragEnd1Pane send -X copy-selection

# Deliberately no hex below: the terminal's own palette has to drive the bar so a theme switch carries over to it.
set -g status-style "fg=colour7,bg=default"
set -g status-left ""
set -g status-right-length 100
set -g status-right "#[fg=colour4]#[fg=colour0,bg=colour4]#[fg=colour4,bg=default]#[fg=colour7] #{b:pane_current_path} "
# The session glyph doubles as the prefix indicator: green normally, red while the prefix is pending
set -ag status-right "#[fg=#{?client_prefix,colour1,colour2}]#[fg=colour0,bg=#{?client_prefix,colour1,colour2}]#[fg=#{?client_prefix,colour1,colour2},bg=default]#[fg=colour7] #S "

set -g window-status-separator " "
set -g window-status-format "#[fg=colour8]#[fg=colour15,bg=colour8]#I #W#[fg=colour8,bg=default]"
set -g window-status-current-format "#[fg=colour13]#[fg=colour0,bg=colour13,bold]#I #W#[fg=colour13,bg=default]"

set -g pane-border-style "fg=colour8"
set -g pane-active-border-style "fg=colour4"
set -g message-style "fg=colour0,bg=colour4"
set -g mode-style "fg=colour0,bg=colour11"
