# Seeded once by cps; never overwritten. Every key here is a code-server flag
# with the leading dashes stripped, and an unknown key is a fatal startup error.
#
# Override any of it per-launch, e.g. a different port:
#   ~/shell/apps/code-server/bin/code-server --bind-addr 127.0.0.1:9000

bind-addr: 127.0.0.1:8080
auth: none

disable-telemetry: true
disable-update-check: true
disable-workspace-trust: true
disable-getting-started-override: true
disable-proxy: true

log: warn
